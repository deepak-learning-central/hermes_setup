version: '3.8'

services:
  hermes:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hermes-setup:local
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "${HERMES_HOST_PORT:-8000}:${HERMES_CONTAINER_PORT:-8000}"
    environment:
      - MODEL_NAME=${HERMES_MODEL_NAME:-NousResearch/Hermes-3-Llama-3.1-8B}
      - CONTEXT_SIZE=${HERMES_CONTEXT_SIZE:-8192}
      - TEMPERATURE=${HERMES_TEMPERATURE:-0.7}
      - TOP_P=${HERMES_TOP_P:-0.9}
      - MAX_TOKENS=${HERMES_MAX_TOKENS:-2048}
      - LOG_LEVEL=${HERMES_LOG_LEVEL:-INFO}
      - HERMES_HF_TOKEN=${HERMES_HF_TOKEN:-}
      - HERMES_OPENAI_API_KEY=${HERMES_OPENAI_API_KEY:-}
      - API_PROVIDER=${API_PROVIDER:-huggingface}
      # Channel integrations
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4g}
          cpus: '${HERMES_CPUS_LIMIT:-2.0}'
        reservations:
          memory: 2g
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "pgrep", "-f", "hermes_setup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hermes-data:
  hermes-models: