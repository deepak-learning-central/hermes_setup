version: '3.8'

services:
  hermes:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: hermes-setup:local
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=NousResearch/Hermes-3-Llama-3.1-8B
      - CONTEXT_SIZE=8192
      - TEMPERATURE=0.7
      - TOP_P=0.9
      - MAX_TOKENS=2048
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hermes-data:
  hermes-models: