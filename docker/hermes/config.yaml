# Hermes Agent Configuration
# This file is used by the Hermes agent runtime
# All values can be overridden via environment variables

model:
  name: NousResearch/Hermes-3-Llama-3.1-8B
  context_size: 8192
  temperature: 0.7
  top_p: 0.9
  max_tokens: 2048

logging:
  level: INFO
  format: json
  file: null

runtime:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  timeout: 300

secrets:
  # Set these via environment variables, NOT in this file
  # hf_token: ${HERMES_HF_TOKEN}
  # openai_api_key: ${HERMES_OPENAI_API_KEY}

storage:
  data_dir: /app/data
  models_dir: /app/models